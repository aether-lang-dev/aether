# nginx as the TLS-terminating control. Same upstream keepalive as the
# cleartext config, so the only difference between the two comparisons is the
# listener.
daemon on;
error_log /tmp/lb-tls-error.log;
pid /tmp/lb-tls.pid;
worker_processes 1;
events { worker_connections 4096; }
http {
    access_log off;
    upstream be {
        server 127.0.0.1:19001;
        server 127.0.0.1:19002;
        keepalive 128;
    }
    server {
        listen 18300 ssl;
        ssl_certificate     /bench/tls/cert.pem;
        ssl_certificate_key /bench/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:BENCH:10m;
        location / {
            proxy_pass http://be;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The aether balancer adds these to every forwarded request, and
            # a comparison where one side builds four headers and the other
            # forwards as-is measures the configuration, not the code. This is
            # also what a real nginx in front of a service is set up to do.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Via               "1.1 nginx";
        }
    }
}
