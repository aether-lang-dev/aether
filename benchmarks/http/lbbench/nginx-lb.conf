# nginx as the control. `keepalive 128` upstream is set deliberately: without
# it nginx dials per request and the comparison measures connection setup
# rather than proxying. #1719 noted its haproxy config had no equivalent, so
# part of the nginx/haproxy gap there was configuration.
daemon on;
error_log /tmp/lb-error.log;
pid /tmp/lb.pid;
# One, which is nginx at its best here, and not a handicap: two workers on the
# two pinned CPUs were measured at 52-82k rps and 19-25 us/req against 115k and
# 8.6 us/req for one, with p99 in milliseconds and socket timeouts, and adding
# `reuseport` did not rescue it. Do not "fix" this to match the CPU count
# without re-measuring.
#
# It does mean nginx serves the run on about one core while aether and haproxy
# use about two, so its CPU-per-request column is not comparable with theirs on
# its own. Cores in use is rps x cpu-per-request; read the two together.
worker_processes 1;
events { worker_connections 4096; }
http {
    access_log off;
    upstream be {
        server 127.0.0.1:19001;
        server 127.0.0.1:19002;
        keepalive 128;
    }
    server {
        listen 18200;
        location / {
            proxy_pass http://be;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The aether balancer adds these to every forwarded request, and
            # a comparison where one side builds four headers and the other
            # forwards as-is measures the configuration, not the code. This is
            # also what a real nginx in front of a service is set up to do.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Via               "1.1 nginx";
        }
    }
}
