# DIAGNOSTIC ONLY (#3338): runs the worker-path send-timeout case 40 times on
# macOS and Linux with the server's waits logged. Lives on wip/3338-diag only;
# the branch is deleted when the cause is found.
name: wip 3338 send-timeout diagnostic

on:
  push:
    branches: [ 'wip/3338-diag' ]

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-latest
            cc: clang
          - name: Linux GCC
            os: ubuntu-22.04
            cc: gcc
    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain
      if: runner.os == 'Linux'
      run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list; sudo apt-get update && sudo apt-get install -y gcc make bc pkg-config
    - name: Build
      run: CC=${{ matrix.cc }} make -j4 compiler ae stdlib
    - name: Build the diagnostic
      run: ./build/ae build tests/integration/http_proxy_send_timeout/diag_worker.ae -o build/diag_worker
    - name: Run it 40 times each way
      run: |
        for pre in 1; do
          whole=0
          for i in $(seq 1 80); do
            DIAG_PRE=$pre AETHER_SENDWAIT_LOG=1 ./build/diag_worker > out.txt 2> err.txt
            r=$(grep '^RESULT' out.txt)
            echo "pre=$pre run $i: $r"
            case "$r" in
              *whole*)
                whole=$((whole + 1))
                echo "---- pre=$pre run $i server waits and client buffer:"
                grep -v '^\[sendprog\]' err.txt | head -20
                grep '^\[sendprog\]' err.txt | head -40
                ;;
              *)
                echo "  waits: $(grep -c '\[sendwait\]' err.txt), last: $(grep '\[sendwait\]' err.txt | tail -2 | tr '\n' ' ')"
                echo "  progress: $(grep '\[sendprog\]' err.txt | tail -2 | tr '\n' ' ')"
                ;;
            esac
          done
          echo "PRE=$pre WHOLE $whole of 80"
        done
