name: Windows Build

# A change that touches only VERSION and CHANGELOG.md is a release bump, and
# that tree was already built and tested on main before the release was cut.
# Running the full matrix on it again gains nothing and costs twice over: the
# runs queue behind main's, and the release PR is merged before they are given
# a runner, so every release leaves abandoned runs recorded as failures. Every
# release branch from v0.614.0 onward shows three of them, while the releases
# themselves published fine.
#
# Skipping also frees the runners the Release workflow queues behind, which is
# what left v0.617.0 unpublished for a quarter of an hour after its tag
# existed. paths-ignore skips only when every changed file matches, so a commit
# that touches code and the changelog together still runs in full.
on:
  # push to main also runs so the merge build can FILL the miniaudio object
  # cache (PR runs only read it; see the Restore/Save split below).
  push:
    branches: [ main ]
    paths-ignore: [ 'CHANGELOG.md', 'VERSION' ]
  pull_request:
    branches: [ main, develop ]
    paths-ignore: [ 'CHANGELOG.md', 'VERSION' ]
  workflow_dispatch:

# Build the Aether compiler and ae CLI on Windows using MinGW (GCC).
# MinGW gives us the same GCC/Clang toolchain surface without an MSVC license,
# while our aether_thread.h Win32 compat layer keeps the runtime fully native.
#
# Two tiers (#1592 / #1593):
#   1. windows-cross — a FAST lane on a Linux runner: `zig cc -target
#      x86_64-windows-gnu` cross-build of compiler + ae + stdlib, in a few
#      minutes. Catches Windows-only COMPILE breakage (missing Win32 shims,
#      MinGW-class portability bugs) while the author is still in the PR.
#   2. build-mingw / headers-msvc — the real thing on windows-latest, and
#      the only tier that RUNS anything. The actual gate.
#
# The slow tier `needs:` the fast one, so a cross-build failure skips ~20
# minutes of doomed MSYS2 compute. Cost: the MSYS2 legs start a few minutes
# later on green runs — worth it, since a compile break surfaces at minute
# ~4 instead of ~20.
#
#   3. windows-wine — RUNS the tests, on a Linux runner (#1876).
#
# #1593 tried the Wine half and failed on one detail: it ran `ae` ITSELF
# inside Wine. `ae` is a compile-and-run driver, so it went looking for a PE
# gcc.exe in the prefix and tried to download 250 MB of MinGW-w64 mid-job.
# The blocker is specific to that, and disappears when the split is drawn
# differently: cross-build each test to a .exe on the LINUX HOST (native `ae`
# + `zig cc -target x86_64-windows-gnu`), then let Wine merely EXECUTE the
# finished binary. Wine never compiles anything, so no toolchain is needed in
# the prefix and no Windows libaether.a has to live beside the native one.
#
# This lane does not gate build-mingw, so a green run is no slower than
# before. What it changes is time-to-signal on Windows RUNTIME breakage:
# behaviour that compiles fine and then differs on Windows previously had no
# signal until the MSYS2 legs finished, ~25 minutes in.

jobs:
  # ============================================================
  # FAST LANE — cross-build for Windows on a Linux runner
  # ============================================================
  windows-cross:
    name: Windows / cross-build (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: sudo apt-get update && sudo apt-get install -y gcc make bc curl xz-utils

    # Restore on every run, save only on a main-merge miss. Zig bundles the
    # mingw-w64 headers + CRT sources, so there is no sysroot to fetch.
    - name: Restore zig toolchain cache
      id: zig_cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .zig
        key: zig-only-${{ hashFiles('scripts/get-zig.sh') }}

    - name: Provision zig
      id: prov
      run: |
        ZIG="$($GITHUB_WORKSPACE/scripts/get-zig.sh "$GITHUB_WORKSPACE/.zig")"
        test -x "$ZIG" || { echo "zig not provisioned"; exit 1; }
        test "$("$ZIG" version)" = 0.16.0 || { echo "expected zig 0.16.0"; exit 1; }
        echo "zig=$ZIG" >> "$GITHUB_OUTPUT"
        "$ZIG" version

    - name: Save zig toolchain cache (merge to main, on miss only)
      if: >-
        github.event_name == 'push' && github.ref == 'refs/heads/main'
        && steps.zig_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          .zig
        key: zig-only-${{ hashFiles('scripts/get-zig.sh') }}

    # The fail-fast half: Windows-only -Werror breakage, MinGW __thread
    # traps and missing Win32 shims surface here, minutes into the PR.
    #
    # NB warnings here are NOT fatal (this builds the plain targets, not
    # `make ci`). zig's bundled mingw-w64 headers are not byte-identical to
    # MSYS2's — e.g. a couple of -Wsign-compare diagnostics originate inside
    # Winsock's own FD_SET macro, where SOCKET is unsigned. Promoting those
    # to errors would fail the fast lane on a third-party header and train
    # people to ignore it. Warning-as-error enforcement stays with the MSYS2
    # legs below, against the headers Windows users actually compile with.
    - name: Cross-build the toolchain for Windows (WINDOWS=1)
      run: |
        make compiler ae stdlib \
          WINDOWS=1 \
          ZIG="${{ steps.prov.outputs.zig }}" \
          -j"$(nproc)"

    # A cross build that silently emitted Linux binaries would prove nothing
    # (mirrors the FreeBSD leg's `file | grep FreeBSD` guard).
    - name: Verify the artifacts really are PE
      run: |
        file build/aetherc.exe build/ae.exe
        file build/ae.exe | grep -q 'PE32+' || { echo "ae.exe is not a PE binary"; exit 1; }
        file build/aetherc.exe | grep -q 'PE32+' || { echo "aetherc.exe is not a PE binary"; exit 1; }

    - name: Upload cross-built binaries
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: aether-windows-cross-x86_64
        path: |
          build/aetherc.exe
          build/ae.exe
        retention-days: 7

  # ============================================================
  # MinGW build — primary Windows target
  # Full CI suite: compiler (-Werror), ae, stdlib, unit tests,
  # .ae integration tests (includes REPL tests), examples.
  #
  # Once per CRT: MINGW64 links msvcrt.dll, UCRT64 links the UCRT, and their
  # export sets differ (#1494).
  # ============================================================
  # ============================================================
  # RUNTIME LANE — cross-build on Linux, execute under Wine (#1876)
  # ============================================================
  windows-wine:
    name: Windows / runtime under Wine (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deliberately NOT a dependency of build-mingw: this is extra signal, not
    # a gate, so it must not add latency to an otherwise green run.

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo -E apt-get install -y --no-install-recommends \
          build-essential wine file

    - name: Provision zig
      id: prov
      run: |
        ZIG_VER=0.13.0
        curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" \
          | tar -xJ -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/zig-linux-x86_64-${ZIG_VER}" >> "$GITHUB_PATH"

    # The NATIVE toolchain: the cross build is driven by a host `ae`, which is
    # exactly what keeps Wine out of the compile path.
    - name: Build the native toolchain
      run: make compiler ae stdlib -j"$(nproc)"

    - name: Run the Windows runtime sweep under Wine
      run: |
        zig version
        wine --version
        JOBS="$(nproc)" bash tests/scripts/windows_wine_sweep.sh

  build-mingw:
    name: Build + Test (Windows / ${{ matrix.msystem }})
    runs-on: windows-latest
    # Gate on the fast lane (#1593): a cross-build or Wine failure skips
    # ~20 minutes of doomed MSYS2 compute. `needs:`-skipped jobs report as
    # SKIPPED, not failed — with these as required checks the PR still
    # reads red from windows-cross's own failure, so branch protection
    # behaves correctly.
    needs: windows-cross

    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
            root: mingw64
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            root: ucrt64

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSYS2 / MinGW-w64
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: >-
          ${{ matrix.prefix }}-gcc
          ${{ matrix.prefix }}-make
          ${{ matrix.prefix }}-openssl
          ${{ matrix.prefix }}-ca-certificates
          ${{ matrix.prefix }}-zlib
          pkg-config
          make
          bc

    # Cache the compiled miniaudio object — same rationale as ci.yml. The
    # MinGW toolchain identity is folded into the Makefile stamp, and the key
    # carries the MSYS2 environment, so the two CRT legs never share an object
    # and neither collides with the Linux/macOS caches. Split restore/save: PR
    # runs only RESTORE; only a push to main SAVES, and only on a cache miss
    # (an unchanged source is a key hit, so there is nothing new to write; the
    # key already embeds the source hash).
    - name: Restore miniaudio object cache
      id: audio_cache
      uses: actions/cache/restore@v4
      with:
        path: .ci-cache
        key: audio-obj-windows-${{ matrix.root }}-${{ hashFiles('std/audio/miniaudio.h', 'std/audio/aether_audio.c', 'std/audio/aether_audio.h') }}

    - name: Run full CI suite
      # See ci.yml::ci-windows for why SSL_CERT_FILE is exported here.
      # Hardcoded probe paths in aether_http.c don't match the GitHub
      # runner's MSYS2 install location.
      run: |
        export SSL_CERT_FILE="$(cygpath -w /${{ matrix.root }}/etc/ssl/certs/ca-bundle.crt)"
        echo "SSL_CERT_FILE=$SSL_CERT_FILE"
        ls -la "$(cygpath -u "$SSL_CERT_FILE")"
        make ci

    - name: Save miniaudio object cache (merge to main, on miss only)
      if: >-
        github.event_name == 'push' && github.ref == 'refs/heads/main'
        && steps.audio_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .ci-cache
        key: audio-obj-windows-${{ matrix.root }}-${{ hashFiles('std/audio/miniaudio.h', 'std/audio/aether_audio.c', 'std/audio/aether_audio.h') }}

    - name: Upload Windows binaries
      uses: actions/upload-artifact@v4
      with:
        name: aether-windows-${{ matrix.root }}
        path: |
          build/aetherc.exe
          build/ae.exe
        retention-days: 30

  # ============================================================
  # MSVC compatibility check — ensure headers compile under cl.exe
  # No full build yet (runtime needs Win32 threading wiring), but
  # we verify that all public headers pass the MSVC parser.
  # ============================================================
  headers-msvc:
    name: Header compatibility (MSVC)
    runs-on: windows-latest
    needs: windows-cross

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Visual Studio developer environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Check portable headers compile under cl.exe
      shell: cmd
      run: |
        :: Compile each portable header as a standalone translation unit.
        :: This catches any GCC-isms that slipped through the guards.
        :: Note: cl.exe cannot open 'nul' as a source file — use a real empty file.
        echo. > _probe.c

        cl /nologo /W3 /std:c11 /Zc:preprocessor ^
           /I runtime /I runtime/utils /I runtime/actors ^
           /I runtime/scheduler /I runtime/memory /I runtime/config ^
           /FI runtime/utils/aether_compiler.h /c _probe.c ^
           && echo "aether_compiler.h OK" || exit 1

        cl /nologo /W3 /std:c11 /Zc:preprocessor ^
           /I runtime /I runtime/utils /I runtime/actors ^
           /I runtime/scheduler /I runtime/memory /I runtime/config ^
           /FI runtime/utils/aether_thread.h /c _probe.c ^
           && echo "aether_thread.h OK" || exit 1

        del _probe.c _probe.obj 2>nul
