name: Release

# Every merge to main creates a versioned release automatically.
#
# Version bump rules:
#   - Commit message starts with "major"  ->  bump MAJOR
#   - Anything else                       ->  bump MINOR (default)
#
# Manual tag push (v*.*.*) also triggers a build + publish.
#
# Flow (state-based, no commit message parsing):
#   1. Push to main → prepare job reads VERSION and checks if vX.Y.Z tag exists
#   2a. Tag EXISTS   → bump job computes next version, opens a release PR
#   2b. Tag MISSING  → tag job creates vX.Y.Z tag from HEAD
#   3. Tag push → build + publish jobs create the GitHub Release
#
# This is robust regardless of merge strategy (squash, merge commit, rebase).

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Serialize all release runs — prevents race conditions when multiple PRs
# merge in quick succession (second run queues until first completes).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ================================================================== #
  # PREPARE — decide whether to bump or tag based on repo state        #
  # ================================================================== #
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # `pull-requests: read` lets the decide step query PR state via gh,
    # so we can distinguish an in-flight release PR (skip) from an
    # abandoned branch (delete + retry). `contents: write` is needed
    # to delete a stale release branch.
    permissions:
      contents: write
      pull-requests: read

    outputs:
      action:  ${{ steps.decide.outputs.action }}
      version: ${{ steps.decide.outputs.version }}
      tag:     ${{ steps.decide.outputs.tag }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Decide action
      id: decide
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        TAG="v${VERSION}"

        if git rev-parse "$TAG" >/dev/null 2>&1; then
          # Tag exists for current VERSION → compute next version from latest tag
          # Use latest git tag (not VERSION file) to avoid stale-VERSION chains
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="$TAG"
          fi
          OLD=$(echo "$LATEST_TAG" | sed 's/^v//')
          MAJOR=$(echo "$OLD" | cut -d. -f1)
          MINOR=$(echo "$OLD" | cut -d. -f2)

          if echo "$COMMIT_MSG" | grep -q "^major"; then
            NEW="$((MAJOR + 1)).0.0"
          else
            NEW="${MAJOR}.$((MINOR + 1)).0"
          fi

          NEW_TAG="v$NEW"
          BRANCH="release/v${NEW}"

          # If next tag also exists (idempotent), skip entirely
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists -- nothing to do"
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the branch exists, decide based on its PR state — not branch
          # existence alone. Previous logic skipped on branch existence,
          # which left the workflow permanently stuck whenever a release PR
          # was abandoned without being merged or closed.
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            PR_STATE=$(gh pr list --head "$BRANCH" --state all --json state --jq '.[0].state // ""' 2>/dev/null || echo "")

            case "$PR_STATE" in
              OPEN)
                echo "Release PR for $BRANCH is OPEN -- skipping (waiting on merge)"
                echo "action=skip" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              MERGED)
                # Should not normally hit here: a merged release PR would have
                # bumped VERSION on main, so the outer "tag exists" check
                # would have flipped us to action=tag. Treat as skip to be safe.
                echo "Release PR for $BRANCH is MERGED but VERSION not advanced -- skipping"
                echo "action=skip" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              CLOSED|"")
                # Closed without merging, or no PR was ever opened for the
                # branch — branch is stale. Delete it and fall through to
                # creating a fresh bump PR.
                echo "Release PR for $BRANCH is ${PR_STATE:-MISSING} -- deleting stale branch and re-bumping"
                git push origin --delete "$BRANCH" || true
                ;;
            esac
          fi

          echo "action=bump"      >> "$GITHUB_OUTPUT"
          echo "version=$NEW"     >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG"     >> "$GITHUB_OUTPUT"
          echo "Will bump: $OLD -> $NEW (latest tag: $LATEST_TAG)"
        else
          # No tag for current VERSION → this is a merged release PR, create tag
          echo "action=tag"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "Will tag: $TAG"
        fi

  # ================================================================== #
  # BUMP — open a version-bump PR                                      #
  # ================================================================== #
  bump:
    name: Auto-bump version
    needs: prepare
    if: needs.prepare.outputs.action == 'bump'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Create release PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ needs.prepare.outputs.version }}"
        BRANCH="release/v${VERSION}"

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git checkout -b "$BRANCH"

        # Update VERSION file
        echo "$VERSION" > VERSION
        git add VERSION

        # Turn [current] into this version's heading (#1477).
        #
        # This used to be a bare `if grep -q ... ; then rename; fi`, which does
        # exactly what it says and silently ships a release with no CHANGELOG
        # section when the condition is false. Releases 0.506.0 through 0.509.0
        # went out that way: four releases of real work, including a Windows
        # packaging fix, recorded nowhere. The file is what a downstream
        # consumer reads to decide whether to upgrade, so silence is the one
        # outcome that must not be available.
        #
        # An intentionally empty release is still possible, it just has to say
        # so: put [skip changelog] in the release-trigger commit message.
        SKIP_CHANGELOG=0
        if git log -1 --pretty=%B | grep -qi '\[skip changelog\]'; then
          SKIP_CHANGELOG=1
        fi

        if grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
          echo "::error::CHANGELOG.md already has a '## [${VERSION}]' heading."
          echo "A blind rename would create a second one; ## [0.435.0] and"
          echo "## [0.497.0] are both duplicated on main from exactly this."
          exit 1
        fi

        # Does [current] actually say anything, or is it just a heading?
        # Once the release leaves a fresh empty [current] behind (below), the
        # presence of the heading stops meaning there is something to ship,
        # so the emptiness guard has to look at the body instead.
        CURRENT_BODY=$(awk '/^## \[current\]$/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md \
                       | grep -vE '^[[:space:]]*$|^### ' | head -1)

        if [ -n "$CURRENT_BODY" ]; then
          # Anchored to line-start and limited to the first match. An
          # unanchored, unlimited `s/## \[current\]/.../` rewrites every
          # occurrence in the file — including ones inside prose. That is not
          # hypothetical: it is how the 0.515.0 heading became
          # `## [0.515.0]'; then rename;`. That entry described this very
          # rename step and quoted `## [current]` in its body, so the release
          # corrupted the one entry documenting its own bug.
          sed -i "0,/^## \[current\]$/s//## [${VERSION}]/" CHANGELOG.md

          # Leave a fresh, empty [current] above the version just cut.
          #
          # Without this, main has no [current] between releases, and every
          # open branch that added one collides with the new version heading
          # in the same position: git resolves it by taking main's heading,
          # so the branch's entry lands inside a released section and the
          # file ends up with no [current] at all. That has happened to three
          # separate branches, each fixed by hand.
          #
          # With a [current] always present, a branch's [current] merges with
          # main's rather than against a version heading, and the entries
          # underneath merge as text.
          printf '## [current]\n\n' > /tmp/changelog.new
          awk -v v="## [${VERSION}]" '
              $0 == v && !done { print; done = 1; next }
              { print }
          ' CHANGELOG.md >> /tmp/changelog.new
          # Splice: everything before the new version heading is the preamble,
          # so the empty [current] goes immediately above it.
          awk -v v="## [${VERSION}]" '
              BEGIN { inserted = 0 }
              $0 == v && !inserted { print "## [current]"; print ""; inserted = 1 }
              { print }
          ' CHANGELOG.md > /tmp/changelog.spliced
          mv /tmp/changelog.spliced CHANGELOG.md
          rm -f /tmp/changelog.new

          git add CHANGELOG.md
        elif [ "$SKIP_CHANGELOG" = "1" ]; then
          echo "No [current] section, and the trigger commit says [skip changelog]."
        else
          echo "::error::No '## [current]' section in CHANGELOG.md, so ${VERSION}"
          echo "would ship with nothing recorded. Add the entry under a"
          echo "'## [current]' heading, or put [skip changelog] in the"
          echo "release-trigger commit if this release is genuinely empty."
          exit 1
        fi

        # Only commit if there are staged changes
        if git diff --cached --quiet; then
          echo "No changes to commit -- skipping"
          exit 0
        fi

        git commit -m "chore: release ${VERSION}"
        git push origin "$BRANCH"

        gh pr create \
          --base main \
          --head "$BRANCH" \
          --title "chore: release ${VERSION}" \
          --body "Auto-generated version bump to **${VERSION}**.

        Merging this PR will trigger a tag + release build."

  # ================================================================== #
  # TAG — create git tag (release PR just merged)                      #
  # ================================================================== #
  tag:
    name: Tag release
    needs: prepare
    if: needs.prepare.outputs.action == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag:     ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Create and push tag
      id: t
      run: |
        VERSION="${{ needs.prepare.outputs.version }}"
        TAG="${{ needs.prepare.outputs.tag }}"

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git tag "$TAG"
        git push origin "$TAG"

        echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Created tag $TAG"

  # ================================================================== #
  # BUILD -- all four platforms                                         #
  #                                                                    #
  # Runs when: tag job succeeds, or manual tag push.                   #
  # Checks out the exact release tag so binaries match VERSION.        #
  # ================================================================== #
  build:
    name: Build -- ${{ matrix.target }}
    needs: tag
    if: |
      always() && (
        (needs.tag.result == 'success' && needs.tag.outputs.tag != '') ||
        startsWith(github.ref, 'refs/tags/')
      )
    runs-on: ${{ matrix.os }}
    # A healthy build+test is ~10 min (macOS ARM64 up to ~22). Cap well under
    # GitHub's multi-hour default so a hung test (see the per-test `timeout`
    # in Makefile test-ae) can't idle the release job for ~3h before it's
    # cancelled — the failure mode that left 0.442.0 tagged but unpublished.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the Linux release build to the OLDEST supported glibc, not
          # ubuntu-latest. glibc symbol versioning is forward-only: a binary
          # linked against a newer glibc references versioned symbols (e.g.
          # GLIBC_2.38) that an older loader cannot satisfy, so it fails at
          # startup with "version `GLIBC_2.xx' not found". ubuntu-latest tracks
          # the newest Ubuntu (24.04 = glibc 2.39), which broke the release on
          # Debian 12 (glibc 2.36) and other still-current distros. 22.04 ships
          # glibc 2.35 — old enough for Debian 12 / Ubuntu 22.04+ / current
          # mainstream distros. See docs/release-glibc-portability.md for the
          # longer-term plan (musl-static) and its trade-offs.
          - os: ubuntu-22.04
            target: linux-x86_64
            ext: ""
          - os: macos-15-intel
            target: macos-x86_64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            ext: ""
          - os: windows-latest
            target: windows-x86_64
            ext: ".exe"

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.tag.outputs.tag || github.ref }}
        # Full history + all tags. A shallow checkout of a tag does not
        # reliably give `git tag -l` the current tag set, which used to let the
        # Makefile stamp binaries with an older version (see Makefile:66).
        # Belt-and-braces now that VERSION is authoritative, but this job
        # compiles the UPLOADED artifacts so it should not be the thin one.
        fetch-depth: 0
        fetch-tags: true

    # -- Linux ---
    - name: Setup (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update && sudo apt-get install -y gcc make bc python3-pip
        # The websocket suites check our RFC 6455 implementation against an
        # independent one, and they fail rather than skip on a Linux CI runner
        # because a silent skip would hide the only thing they exist for.
        # This job runs them, so it has to provide the peer, and it did not:
        # the release failed on a dependency the tests legitimately require
        # while ci.yml had been installing it in its matrix all along.
        #
        # Same line ci.yml uses. Not the distribution package: this leg runs on
        # 22.04 for glibc reasons (see the matrix above), and 22.04 ships
        # websockets 9.1, which the probe rejects for good reason -- it passes
        # asyncio's removed loop= argument and dies mid-handshake on Python
        # 3.10+. pip gets a current one.
        pip install --break-system-packages websockets 2>/dev/null || pip install websockets

    # -- Windows -- MinGW-w64 via MSYS2 ---
    - name: Setup (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        # zlib + openssl are baked into the Windows release binary so
        # std.zlib, std.cryptography, and std.net TLS work
        # out-of-the-box for downstream Windows users. Without them
        # AETHER_HAS_ZLIB / AETHER_HAS_OPENSSL stay undefined and the
        # shipped binary silently falls into the "unavailable" stubs.
        # ca-certificates ships /mingw64/etc/ssl/certs/ca-bundle.crt —
        # required for HTTPS in std.net (without it the OpenSSL handshake
        # completes but cert verification fails for lack of a trust
        # anchor on Windows). Mirrors ci.yml::ci-windows.
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-ca-certificates
          pkg-config
          make
          zip
          bc

    # -- Build + test: Linux / macOS ---
    - name: Build (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        make compiler
        make ae
        make stdlib

    - name: Test (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        make test
        make test-ae
        make test-install
        make test-release-archive

    - name: Strip (Unix)
      if: matrix.os != 'windows-latest'
      run: strip build/aetherc build/ae 2>/dev/null || true

    # -- Build + test: Windows (MSYS2 shell) ---
    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        make compiler
        make ae
        make stdlib

    - name: Test (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      # The hardcoded `C:\msys64\...` probe in aether_http.c::load_windows_ca_bundle
      # doesn't match the GitHub runner's MSYS2 path (it's installed under a
      # temp dir, not C:\msys64). Export SSL_CERT_FILE explicitly using
      # cygpath -w so the first probe in get_ssl_ctx() hits regardless of
      # where MSYS2 lives on this runner. Without this, `tests/regression/
      # test_https_client.ae` fails with "certificate verify failed".
      # Mirrors ci.yml::ci-windows.
      run: |
        export SSL_CERT_FILE="$(cygpath -w /mingw64/etc/ssl/certs/ca-bundle.crt)"
        echo "SSL_CERT_FILE=$SSL_CERT_FILE"
        ls -la "$(cygpath -u "$SSL_CERT_FILE")"
        make test
        make test-ae
        make test-install
        make test-release-archive

    - name: Strip (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: strip build/aetherc.exe build/ae.exe 2>/dev/null || true

    # -- Package: Unix ---
    - name: Package (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        mkdir -p release/bin release/lib release/share/aether release/include/aether
        cp build/aetherc release/bin/
        cp build/ae      release/bin/
        chmod 755 release/bin/*
        if [ -f build/libaether.a ]; then
          cp build/libaether.a release/lib/
        fi
        # Headers (preserve directory structure — must match install.sh)
        for dir in runtime runtime/actors runtime/scheduler runtime/utils \
                   runtime/memory runtime/config std std/string std/io std/math \
                   std/net std/collections std/json std/fs std/log std/http \
                   std/file std/dir std/path std/tcp std/list std/map std/os; do
          if [ -d "$dir" ]; then
            mkdir -p "release/include/aether/$dir"
            cp "$dir"/*.h "release/include/aether/$dir/" 2>/dev/null || true
          fi
        done
        # Runtime source, for linking without libaether.a. MANIFEST lists
        # which of those .c files to compile; without it `ae` cannot build
        # from source at all.
        cp -r runtime release/share/aether/
        cp -r std     release/share/aether/
        # The public headers that sit at the top of include/, libaether.h
        # among them. The loop above only mirrors the runtime/ and std/
        # SUBTREES, so anything directly in include/ was dropped.
        #
        # That matters because include/aether/ is itself an -I directory for
        # an installed tree, and runtime/libaether_caps.c -- shipped in
        # share/aether/runtime/ above -- does `#include "libaether.h"`. The
        # release therefore carried the .c that needs the header and not the
        # header, so a fetched release could cross-compile hello.ae (which
        # pulls no runtime .c) and failed on anything that linked the runtime
        # with `fatal error: 'libaether.h' file not found`. A local install
        # was fine: the Makefile's own staging has copied these since #1420,
        # and this workflow reimplements that staging without the line.
        cp include/*.h release/include/aether/ 2>/dev/null || true
        cp build/MANIFEST release/share/aether/
        cp LICENSE README.md VERSION release/
        cd release && tar -czf ../aether-${VERSION}-${{ matrix.target }}.tar.gz *

    # -- Package: Windows (MSYS2 shell) ---
    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        mkdir -p release/bin release/lib release/share/aether release/include/aether
        cp build/aetherc.exe release/bin/
        cp build/ae.exe      release/bin/
        if [ -f build/libaether.a ]; then
          cp build/libaether.a release/lib/
        fi
        # Headers (preserve directory structure — must match install.sh)
        for dir in runtime runtime/actors runtime/scheduler runtime/utils \
                   runtime/memory runtime/config std std/string std/io std/math \
                   std/net std/collections std/json std/fs std/log std/http \
                   std/file std/dir std/path std/tcp std/list std/map std/os; do
          if [ -d "$dir" ]; then
            mkdir -p "release/include/aether/$dir"
            cp "$dir"/*.h "release/include/aether/$dir/" 2>/dev/null || true
          fi
        done
        # Runtime source, for linking without libaether.a. MANIFEST lists
        # which of those .c files to compile; without it `ae` cannot build
        # from source at all.
        cp -r runtime release/share/aether/
        cp -r std     release/share/aether/
        # The public headers that sit at the top of include/, libaether.h
        # among them. The loop above only mirrors the runtime/ and std/
        # SUBTREES, so anything directly in include/ was dropped.
        #
        # That matters because include/aether/ is itself an -I directory for
        # an installed tree, and runtime/libaether_caps.c -- shipped in
        # share/aether/runtime/ above -- does `#include "libaether.h"`. The
        # release therefore carried the .c that needs the header and not the
        # header, so a fetched release could cross-compile hello.ae (which
        # pulls no runtime .c) and failed on anything that linked the runtime
        # with `fatal error: 'libaether.h' file not found`. A local install
        # was fine: the Makefile's own staging has copied these since #1420,
        # and this workflow reimplements that staging without the line.
        cp include/*.h release/include/aether/ 2>/dev/null || true
        cp build/MANIFEST release/share/aether/
        cp LICENSE README.md VERSION release/
        cd release && zip -r ../aether-${VERSION}-${{ matrix.target }}.zip *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: aether-${{ matrix.target }}
        path: |
          aether-*-${{ matrix.target }}.tar.gz
          aether-*-${{ matrix.target }}.zip
        retention-days: 7

  # ================================================================== #
  # BUILD-FREEBSD -- cross-compile the FreeBSD zip via zig cc           #
  #                                                                    #
  # GitHub Actions has no native FreeBSD runner, so the ae/aetherc     #
  # toolchain is CROSS-built for FreeBSD on the Linux runner with zig  #
  # cc (Makefile FREEBSD=1 mode), against a FreeBSD base sysroot        #
  # provisioned from the aether-crossbuild repo.                        #
  #                                                                    #
  # This leg is REQUIRED, not best-effort. It used to be                #
  # continue-on-error with publish deliberately excluding it from the   #
  # gate, so a FreeBSD compile failure produced a green release that    #
  # silently shipped without the FreeBSD asset. That is precisely how   #
  # the MNT_NODEV break stayed invisible after merge (#402). A broken   #
  # FreeBSD build is now a broken release. PR CI cross-compiles for     #
  # FreeBSD on every pull request, so a code break is caught before it  #
  # can ever reach this point.                                          #
  # ================================================================== #
  build-freebsd:
    name: Build -- freebsd-x86_64 (cross)
    needs: tag
    if: |
      always() && (
        (needs.tag.result == 'success' && needs.tag.outputs.tag != '') ||
        startsWith(github.ref, 'refs/tags/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.tag.outputs.tag || github.ref }}
        # Full history + all tags. A shallow checkout of a tag does not
        # reliably give `git tag -l` the current tag set, which used to let the
        # Makefile stamp binaries with an older version (see Makefile:66).
        # Belt-and-braces now that VERSION is authoritative, but this job
        # compiles the UPLOADED artifacts so it should not be the thin one.
        fetch-depth: 0
        fetch-tags: true

    - name: Setup
      run: sudo apt-get update && sudo apt-get install -y gcc make bc curl xz-utils

    # Zig is checksum-pinned by this repo; the FreeBSD base sysroot (headers +
    # libc) comes from the sibling aether-crossbuild repo, which fetches
    # FreeBSD's published base.txz (BSD-licensed, freely redistributable).
    - name: Checkout aether-crossbuild
      uses: actions/checkout@v4
      with:
        repository: aether-lang-dev/aether-crossbuild
        path: crossbuild
        fetch-depth: 1

    - name: Provision zig + FreeBSD base sysroot
      id: prov
      run: |
        ZIG="$($GITHUB_WORKSPACE/scripts/get-zig.sh "$GITHUB_WORKSPACE/.zig")"
        cd crossbuild
        ./scripts/fetch-freebsd-base.sh x86_64 15
        SR="$PWD/bases/x86_64-freebsd15"
        test -x "$ZIG" || { echo "zig not provisioned"; exit 1; }
        test "$("$ZIG" version)" = 0.16.0 || { echo "expected zig 0.16.0"; exit 1; }
        test -f "$SR/lib/libc.so.7" || { echo "FreeBSD base sysroot missing libc.so.7"; exit 1; }
        echo "zig=$ZIG"       >> "$GITHUB_OUTPUT"
        echo "sysroot=$SR"    >> "$GITHUB_OUTPUT"

    # A host `ae`, built and set aside BEFORE the cross-build overwrites
    # build/ with FreeBSD binaries. The sysroot verification later in this
    # job needs an `ae` that RUNS on this Linux runner, and by then build/ae
    # is a FreeBSD ELF. Cheap: this job already compiles the tree once.
    - name: Build a host ae for the sysroot check
      run: |
        make -s compiler ae stdlib
        mkdir -p host-toolchain
        cp build/ae build/aetherc host-toolchain/
        file host-toolchain/ae

    - name: Cross-build (FREEBSD=1)
      run: |
        make clean >/dev/null 2>&1 || true
        make compiler ae stdlib \
          FREEBSD=1 \
          ZIG="${{ steps.prov.outputs.zig }}" \
          AETHER_SYSROOT="${{ steps.prov.outputs.sysroot }}"
        # Confirm the artifacts really are FreeBSD ELFs before packaging — a
        # cross-build that silently produced Linux binaries would be worse
        # than no FreeBSD zip.
        file build/aetherc build/ae
        file build/ae | grep -q 'FreeBSD' || { echo "ae is not a FreeBSD binary"; exit 1; }
        # #1402: the Unix and Windows legs get this through
        # test-release-archive, which this cross leg does not run. Without it a
        # cross-built archive could ship missing a symbol its own sources
        # define, and fail at the user's link step rather than here.
        sh scripts/check_archive_exports.sh build/libaether.a

    - name: Strip
      run: strip build/aetherc build/ae 2>/dev/null || true

    - name: Package
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        TARGET=freebsd-x86_64
        mkdir -p release/bin release/lib release/share/aether release/include/aether
        cp build/aetherc release/bin/
        cp build/ae      release/bin/
        chmod 755 release/bin/*
        if [ -f build/libaether.a ]; then cp build/libaether.a release/lib/; fi
        for dir in runtime runtime/actors runtime/scheduler runtime/utils \
                   runtime/memory runtime/config std std/string std/io std/math \
                   std/net std/collections std/json std/fs std/log std/http \
                   std/file std/dir std/path std/tcp std/list std/map std/os; do
          if [ -d "$dir" ]; then
            mkdir -p "release/include/aether/$dir"
            cp "$dir"/*.h "release/include/aether/$dir/" 2>/dev/null || true
          fi
        done
        cp -r runtime release/share/aether/
        cp -r std     release/share/aether/
        # The public headers that sit at the top of include/, libaether.h
        # among them. The loop above only mirrors the runtime/ and std/
        # SUBTREES, so anything directly in include/ was dropped.
        #
        # That matters because include/aether/ is itself an -I directory for
        # an installed tree, and runtime/libaether_caps.c -- shipped in
        # share/aether/runtime/ above -- does `#include "libaether.h"`. The
        # release therefore carried the .c that needs the header and not the
        # header, so a fetched release could cross-compile hello.ae (which
        # pulls no runtime .c) and failed on anything that linked the runtime
        # with `fatal error: 'libaether.h' file not found`. A local install
        # was fine: the Makefile's own staging has copied these since #1420,
        # and this workflow reimplements that staging without the line.
        cp include/*.h release/include/aether/ 2>/dev/null || true
        cp build/MANIFEST release/share/aether/
        cp LICENSE README.md VERSION release/
        # Note the cross-build in the archive so downstream users know it was
        # not run through the test suite on FreeBSD.
        echo "Cross-built for FreeBSD with zig cc; not run through the test suite on FreeBSD." \
          > release/FREEBSD-CROSS-BUILD.txt
        cd release && tar -czf "../aether-${VERSION}-${TARGET}.tar.gz" *

    # A FreeBSD CROSS sysroot, so a Linux box can cross-link a FreeBSD binary.
    #
    # This is not the same thing as the tarball above. That one is a NATIVE
    # FreeBSD toolchain meant to run ON FreeBSD, and it rightly carries no
    # libc -- the target host has one. Point AETHER_SYSROOT at it from Linux
    # and the link fails on FreeBSD base symbols. Every other target in the
    # matrix (windows, macos, linux-musl) cross-builds from a fetched release
    # because zig bundles what they need; FreeBSD is the one that needs a
    # base, and nothing published carried it.
    #
    # No extra compute: fetch-freebsd-base.sh already ran above for the
    # cross-build itself, so this is tar-and-upload of a directory that is
    # already on disk.
    #
    # LEAN, not the whole ~477MB base. zig supplies the CRT and libc for the
    # link (adding the base startup objects would duplicate _start), so what
    # a cross-link actually needs from the base is: the platform libraries
    # ae_cross.c names on the link line, a libc.a to satisfy the sysroot
    # completeness probe, and the headers. The verification step below is
    # what makes "lean" safe rather than a guess -- if this set is short by
    # one library, the release fails here instead of shipping an asset that
    # cannot link.
    - name: Package FreeBSD cross sysroot
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        SR="${{ steps.prov.outputs.sysroot }}"
        OUT="$PWD/fbsd-sysroot"
        # BOTH lib/ and usr/lib/, mirroring the base's own layout. FreeBSD
        # puts the runtime .so.N in /lib and a development symlink in
        # /usr/lib pointing at ../../lib/<name>.so.N -- flattening the two
        # into one directory breaks that relative link, and the linker then
        # reports the library as missing even though the file is present.
        mkdir -p "$OUT/lib" "$OUT/usr/lib" "$OUT/usr/include"

        # The libraries the FreeBSD link line references (tools/ae_cross.c:
        # -lthr, plus the casper set libaether.a always pulls), and libc,
        # which the AETHER_SYSROOT completeness check probes for.
        # Copy each library into the SAME subdirectory it came from, so the
        # relative symlinks keep resolving. -a preserves the links
        # themselves; the targets are copied by the .so.N pass below.
        for lib in c thr m casper cap_pwd cap_sysctl cap_grp cap_dns \
                   ssl crypto z pcre2-8 execinfo elf util; do
          for sub in lib usr/lib; do
            [ -d "$SR/$sub" ] || continue
            for f in "$SR/$sub/lib$lib.a" "$SR/$sub/lib$lib.so" \
                     "$SR/$sub/lib$lib".so.[0-9]*; do
              [ -e "$f" ] || continue
              cp -a "$f" "$OUT/$sub/" 2>/dev/null || true
            done
          done
        done

        # Headers: a cross-compile of the runtime includes FreeBSD system
        # headers, so these are not optional.
        if [ -d "$SR/usr/include" ]; then
          cp -a "$SR/usr/include/." "$OUT/usr/include/"
        elif [ -d "$SR/include" ]; then
          cp -a "$SR/include/." "$OUT/usr/include/"
        fi

        {
          printf '%s\n' 'FreeBSD cross sysroot for `ae build --target=x86_64-freebsd` from a'
          printf '%s\n' 'non-FreeBSD host.'
          printf '%s\n' ''
          printf '%s\n' '    tar xJf aether-<v>-freebsd-x86_64-sysroot.tar.xz'
          printf '%s\n' '    AETHER_SYSROOT=$PWD/fbsd-sysroot ae build --target=x86_64-freebsd hello.ae -o hello'
          printf '%s\n' ''
          printf '%s\n' 'This carries only what a cross-LINK needs -- the FreeBSD base'
          printf '%s\n' 'libraries the link line references, and the system headers. zig'
          printf '%s\n' 'supplies the CRT and libc for the link itself. It is NOT a FreeBSD'
          printf '%s\n' 'userland and is not runnable.'
          printf '%s\n' ''
          printf '%s\n' 'The FreeBSD base is redistributable under the FreeBSD license; see'
          printf '%s\n' 'the FreeBSD project for the full base distribution.'
        } > "$OUT/README-SYSROOT.txt"

        tar -cJf "aether-${VERSION}-freebsd-x86_64-sysroot.tar.xz" fbsd-sysroot
        ls -la "aether-${VERSION}-freebsd-x86_64-sysroot.tar.xz"
        du -sh "$OUT"

    # Prove the lean sysroot can actually link before publishing it. Without
    # this the asset could ship one library short and only fail for whoever
    # downloaded it -- which is exactly the failure mode the libaether.h gap
    # had, where the release looked fine because nothing exercised it.
    - name: Verify the sysroot cross-links a real program
      run: |
        # build/ae is a FreeBSD ELF by now (this job cross-built it), so the
        # check uses the host copy set aside before the cross-build. No
        # fallback to build/ae: silently checking with a binary that cannot
        # run would report success without testing anything.
        # `ae` locates zig by running `zig version`, so the provisioned one
        # has to be ON PATH here. The build steps above never needed that --
        # they pass ZIG=<path> to make -- which is why this only showed when
        # the verification step invoked ae directly, and it failed the
        # 0.601.0 release rather than shipping an unverified sysroot.
        ZIG_BIN="${{ steps.prov.outputs.zig }}"
        PATH="$(dirname "$ZIG_BIN"):$PATH"
        export PATH
        zig version || { echo "::error::provisioned zig is not runnable at $ZIG_BIN"; exit 1; }

        HOST_AE="$PWD/host-toolchain/ae"
        [ -x "$HOST_AE" ] || { echo "::error::host ae missing; cannot verify the sysroot"; exit 1; }
        file "$HOST_AE" | grep -q 'FreeBSD' \
          && { echo "::error::host ae is a FreeBSD binary; it cannot run here"; exit 1; }

        printf 'import std.fs\nmain() {\n    _, e = fs.read("/etc/hostname")\n    if e != "" { println("e") }\n    println("ok")\n    return 0\n}\n' > /tmp/sysroot_probe.ae
        AETHER_SYSROOT="$PWD/fbsd-sysroot" \
          "$HOST_AE" build /tmp/sysroot_probe.ae --target=x86_64-freebsd -o /tmp/sysroot_probe \
          || { echo "::error::the packaged lean FreeBSD sysroot cannot cross-link a runtime-linking program"; exit 1; }
        file /tmp/sysroot_probe
        file /tmp/sysroot_probe | grep -q 'FreeBSD' \
          || { echo "::error::the sysroot probe did not produce a FreeBSD binary"; exit 1; }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: aether-freebsd-x86_64
        path: |
          aether-*-freebsd-x86_64.tar.gz
          aether-*-freebsd-x86_64-sysroot.tar.xz
        retention-days: 7

  # ================================================================== #
  # PUBLISH -- create or update the GitHub Release                      #
  # ================================================================== #
  publish:
    name: Publish release
    # build-freebsd is in the `if` gate, not just in `needs`: a release that
    # quietly drops a platform because its build broke is worse than no
    # release, and dropping it silently is what hid the last FreeBSD break.
    needs: [tag, build, build-freebsd]
    runs-on: ubuntu-latest
    if: |
      always() && needs.build.result == 'success'
      && needs.build-freebsd.result == 'success' && (
        (needs.tag.result == 'success' && needs.tag.outputs.tag != '') ||
        startsWith(github.ref, 'refs/tags/')
      )

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.tag.outputs.tag || github.ref }}

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: Resolve release tag
      id: tag
      run: |
        TAG="${{ needs.tag.outputs.tag }}"
        if [ -z "$TAG" ]; then
          TAG="${{ github.ref_name }}"
        fi
        VERSION=$(cat VERSION | tr -d '[:space:]')
        echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build release body
      run: python3 .github/scripts/build_release_body.py ${{ steps.tag.outputs.version }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name:   ${{ steps.tag.outputs.tag }}
        name:       Aether ${{ steps.tag.outputs.version }}
        make_latest: true
        draft: false
        prerelease: ${{ contains(steps.tag.outputs.tag, 'alpha') || contains(steps.tag.outputs.tag, 'beta') || contains(steps.tag.outputs.tag, 'rc') }}
        body_path: /tmp/release_body.md
        files: |
          aether-*.tar.gz
          aether-*.zip
          aether-*-sysroot.tar.xz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Tell the website a version shipped (#1748).
    #
    # aesite regenerates its docs from a released aether tree and stamps the
    # version on the page. Doing that by hand meant doing it late: the site
    # sat on v0.562 while this repo shipped 0.580, so the front page named a
    # version nobody could download and the docs described a toolchain that
    # had moved on.
    #
    # A cross-repo dispatch needs a token this repo's GITHUB_TOKEN cannot
    # provide, so it is a PAT with `contents: write` on aesite, stored as
    # AESITE_SYNC_TOKEN. When the secret is absent — a fork, or before it is
    # configured — the step says so and succeeds: aesite also checks daily on
    # its own, so a missing dispatch delays the site rather than stalling it,
    # and a release must not fail because a downstream notification could not
    # be sent.
    - name: Notify aesite
      if: success()
      env:
        AESITE_TOKEN: ${{ secrets.AESITE_SYNC_TOKEN }}
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        set -euo pipefail
        if [ -z "${AESITE_TOKEN:-}" ]; then
          echo "::notice::AESITE_SYNC_TOKEN is not set — skipping the site notification."
          echo "aesite's daily sync will pick up $TAG within 24h, or run its"
          echo "'sync aether release' workflow manually to publish it now."
          exit 0
        fi
        code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
          -H "Authorization: token $AESITE_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/aether-lang-dev/aesite/dispatches \
          -d "{\"event_type\":\"aether-release\",\"client_payload\":{\"tag\":\"$TAG\"}}")
        if [ "$code" = "204" ]; then
          echo "aesite notified: $TAG"
        else
          # Not fatal: the release itself is published and correct, and the
          # site's daily check is the backstop. Loud, so it is fixed.
          echo "::warning::aesite dispatch returned HTTP $code — the site will"
          echo "::warning::sync on its daily schedule instead. Response:"
          sed 's/^/  /' /tmp/dispatch.out | head -5
        fi
