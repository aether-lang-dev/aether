name: Fuzz

# Coverage-guided fuzzing of every decoder that reads what a peer or an
# untrusted file sends (#3543, #3749): std.cbor's decoder, std.ipc's frame
# reader, the HTTP/1 request head on the server's path, the chunked body
# decoder, the client's URL and Location readers, std.json, the WebSocket
# frame reader, the HTTP/2 glue over nghttp2, the reverse proxy's handling of
# an upstream response, std.xml, std.yaml with the vendored libfyaml,
# std.msgpack, std.tar and std.zip extraction, the TLS 1.3 record layer and
# handshake parsers, and X.509, ASN.1 and PEM. Each target runs under
# libFuzzer, ASan and UBSan and checks properties of its contract, not only
# that nothing crashes (tests/fuzz/README.md): `make fuzz-ci`, each target for
# FUZZ_SECONDS from its committed seed corpus.
#
# A short budget, 60 s a target: a parser's shallow bugs are found in seconds
# from good seeds (a Content-Length truncation, a double free on a request
# line with no version), and depth belongs to the weekly run. Seventeen
# targets would be 17 minutes in one job, so the targets are split across
# three shards that run side by side, about 6 minutes of fuzzing and 4 of
# building each. A pull request fuzzes only the targets its changes reach
# (tests/fuzz/select_targets.sh, which also names the paths below); a change
# to what every target is built with reaches them all. Every push to main
# fuzzes them all, and a weekly run gives each target 10 minutes.
#
# On a failure the reproducers (crash-*, leak-*, timeout-*, oom-* under
# build/fuzz/<target>/) are uploaded: rerun one with that target's binary,
# or with `FUZZ_REPLAY=1 FUZZ_REPLAY_INPUTS=<file> sh tests/fuzz/run_fuzz_c.sh
# <target>` on a machine without libFuzzer.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]
    paths:
      # The decoders (tests/fuzz/select_targets.sh's table).
      - 'std/net/**'
      - 'std/http/server/h2/**'
      - 'std/http/proxy/**'
      - 'std/json/**'
      - 'std/cbor/**'
      - 'std/ipc/**'
      - 'std/xml/**'
      - 'std/yaml/**'
      - 'std/msgpack/**'
      - 'std/tar/**'
      - 'std/zip/**'
      - 'std/zlib/**'
      - 'std/hash/**'
      - 'std/cryptography/**'
      - 'std/fs/**'
      - 'std/os/**'
      - 'std/io/**'
      - 'std/list/**'
      - 'std/bignum/**'
      - 'std/bits/**'
      - 'std/encoding/**'
      - 'std/intarr/**'
      - 'std/strbuilder/**'
      # What every target is built with: the runtime, the compiler and ae
      # (the Aether targets are compiled by `ae build --emit=obj`), the std
      # modules each one links, and the flags the Makefile hands the
      # harnesses (FUZZ_STD_CFLAGS).
      - 'runtime/**'
      - 'compiler/**'
      - 'tools/**'
      - 'std/string/**'
      - 'std/bytes/**'
      - 'std/mem/**'
      - 'Makefile'
      - 'tests/fuzz/**'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/apt-install/**'
  schedule:
    # Weekly, Sunday 03:17 UTC: every target for 10 minutes.
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        required: false
        default: '60'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fuzz:
    name: Linux / Clang + libFuzzer (shard ${{ matrix.shard }}/3)
    # Ubuntu 24.04's clang is 18, whose libFuzzer and sanitizer runtimes are
    # in libclang-rt-18-dev.
    runs-on: ubuntu-24.04
    # Six targets a shard: 10 minutes of building and fuzzing at 60 s each,
    # a little over an hour at the weekly run's 600.
    timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    # Which targets this shard fuzzes: on a pull request the ones its
    # changes reach, else every one; then this shard's share.
    - name: Select the targets
      id: select
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        SHARD: ${{ matrix.shard }}
      run: |
        set -eu
        if [ "${{ github.event_name }}" = pull_request ]; then
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          targets="$(sh tests/fuzz/select_targets.sh --changed "$RUNNER_TEMP/changed.txt" --shard "$SHARD/3")"
        else
          targets="$(sh tests/fuzz/select_targets.sh --all --shard "$SHARD/3")"
        fi
        echo "targets=$targets" >> "$GITHUB_OUTPUT"
        echo "Shard $SHARD/3 fuzzes: ${targets:-nothing, since no target input changed}"

    - name: Install packages
      if: steps.select.outputs.targets != ''
      uses: ./.github/actions/apt-install
      with:
        # libnghttp2-dev: the h2 target, and the server's HTTP/2 support in
        # the libaether it links.
        packages: clang libclang-rt-18-dev make bc pkg-config libnghttp2-dev
        scope: fuzz

    - name: Build the toolchain
      if: steps.select.outputs.targets != ''
      run: make -j"$(nproc)" compiler ae stdlib

    - name: make fuzz-ci
      if: steps.select.outputs.targets != ''
      env:
        FUZZ_TARGETS: ${{ steps.select.outputs.targets }}
        FUZZ_SECONDS: ${{ github.event.inputs.seconds || (github.event_name == 'schedule' && '600') || '60' }}
      run: make fuzz-ci

    - name: Upload the reproducers
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: fuzz-reproducers-${{ matrix.shard }}
        path: |
          build/fuzz/*/crash-*
          build/fuzz/*/leak-*
          build/fuzz/*/timeout-*
          build/fuzz/*/oom-*
        if-no-files-found: ignore
