# VERIFICATION ONLY (#3338): runs tests/integration/http_proxy_send_timeout
# 80 times on macOS with the server's waits and send progress logged, to see
# why the worker path came back whole in 2 runs of 40 with little waiting at
# the client's wake. Lives on wip/3338-verify only; deleted once read.
name: wip 3338 send-timeout verification

on:
  push:
    branches: [ 'wip/3338-verify' ]

permissions:
  contents: read

jobs:
  verify:
    name: macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: CC=clang make -j4 compiler ae stdlib
    - name: Build the test
      run: ./build/ae build tests/integration/http_proxy_send_timeout/send_timeout.ae -o build/send_timeout
    - name: Run it 80 times
      run: |
        pass=0; fail=0
        for i in $(seq 1 80); do
          if AETHER_SENDWAIT_LOG=1 ./build/send_timeout > out.txt 2> err.txt; then
            pass=$((pass + 1)); echo "run $i ok: $(grep '\[diag\]' out.txt | tr '\n' ' ')"
          else
            fail=$((fail + 1)); echo "---- run $i FAILED:"; cat out.txt; echo "---- its server log:"; head -80 err.txt
          fi
        done
        echo "PASS $pass FAIL $fail of 80"
