name: Memory Leak Detection

# A change that touches only VERSION, CHANGELOG.md and new_changelogs/ is a
# release bump, and that tree was already built and tested on main before the
# release was cut.
# Running the full matrix on it again gains nothing and costs twice over: the
# runs queue behind main's, and the release PR is merged before they are given
# a runner, so every release leaves abandoned runs recorded as failures. Every
# release branch from v0.614.0 onward shows three of them, while the releases
# themselves published fine.
#
# Skipping also frees the runners the Release workflow queues behind, which is
# what left v0.617.0 unpublished for a quarter of an hour after its tag
# existed. paths-ignore skips only when every changed file matches, so a commit
# that touches code and the changelog together still runs in full.
#
# new_changelogs/ joined the list with the fragment system (#2002): a release
# PR now also deletes the fragments it folds into CHANGELOG.md, so with only
# the two files listed, every release from then on ran the whole matrix twice,
# on the release PR and again on its merge, with nothing to test. On
# 2026-10-05 that load, on the org's shared runner pool, held ordinary PR jobs
# queued for up to an hour, and one was cancelled unstarted (#2440).
on:
  push:
    branches: [ main, master, develop ]
    paths-ignore: [ 'CHANGELOG.md', 'VERSION', 'new_changelogs/**' ]
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore: [ 'CHANGELOG.md', 'VERSION', 'new_changelogs/**' ]
  workflow_dispatch:

# Cancel a superseded run when a new commit lands on the same PR, as ci.yml
# and windows.yml already do. Without it, every push to a PR left the previous
# run's seven jobs testing a commit nobody was on any more, holding runners the
# other workflows were queued for. Keyed by workflow + ref, and NOT applied to
# main, where each push is a merge worth recording.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  valgrind-test:
    name: Valgrind Memory Leak Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list; sudo apt-get update
        sudo apt-get install -y gcc make valgrind

    - name: Build with debug symbols
      run: |
        make clean
        make compiler CFLAGS="-O0 -g"
        make test-build CFLAGS="-O0 -g"

    - name: Run Valgrind on test suite
      id: valgrind
      # --fair-sched=yes: Valgrind runs one thread at a time, and its default
      # lock lets the thread that has just given it up take it straight back
      # (manual, 2.8.1). A thread busy-waiting for another, as the scheduler
      # tests' threads do, then kept it slice after slice while the thread it
      # waited on barely ran: two tests that take 13 s under massif took 23
      # and 40 minutes here (#2593). The futex lock hands it out in turn.
      #
      # The status is kept for the next step: the run is not cut short by it,
      # so the logs are complete either way. Valgrind's report goes to a file
      # of its own: interleaved with the runner's buffered output, its lines
      # could start mid-line and escape the checks below.
      run: |
        set +e
        valgrind --leak-check=full \
                 --show-leak-kinds=all \
                 --track-origins=yes \
                 --fair-sched=yes \
                 --verbose \
                 --error-exitcode=1 \
                 --suppressions=.valgrind-suppressions \
                 --log-file=valgrind-report.txt \
                 ./build/test_runner 2>&1 | tee valgrind-output.txt
        echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

    - name: Check for errors, failed tests and leaks
      # Any memcheck error fails the job, not only an invalid read, write or
      # free, and so does a failed unit test: the status of the run above is
      # Valgrind's --error-exitcode on an error or a definite or possible
      # leak, else the test runner's own. It used to be piped away, and this
      # step looked for three kinds of error by name, so main passed with 86
      # uninitialised reads (#2599).
      env:
        STATUS: ${{ steps.valgrind.outputs.status }}
      run: |
        sed 's/\x1b\[[0-9;]*m//g' valgrind-output.txt > valgrind-clean.txt
        grep -a -E '^Summary: ' valgrind-clean.txt || echo "No test summary: the runner did not finish."
        grep -a -E '^==[0-9]+== +(ERROR SUMMARY|definitely lost|indirectly lost|possibly lost):' valgrind-report.txt | sort -u
        if [ "$STATUS" = "0" ]; then
          echo "SUCCESS: no memcheck errors, no leaks, no failed tests"
          exit 0
        fi
        echo "ERROR: the Valgrind run exited with status $STATUS"
        grep -a -E '\[FAIL\]' valgrind-clean.txt | head -20 || true
        # Valgrind's own report of each error and leak, with its stack.
        grep -a -E -A 14 '^==[0-9]+== (Conditional jump|Use of uninitialised|Invalid (read|write|free)|Mismatched free|Syscall param|Source and destination overlap|[0-9,]+ (\(.*\) )?bytes in [0-9,]+ blocks are (definitely|possibly|indirectly) lost)' valgrind-report.txt | head -120 || true
        exit 1

    - name: Slowest tests under Valgrind
      if: always()
      # Each test's own time, slowest first, in the job summary, so a test
      # that slows down under Valgrind shows there and not only in how long
      # the job took (#2593).
      run: |
        [ -f valgrind-output.txt ] || exit 0
        {
          echo "### Slowest tests under Valgrind"
          echo
          echo "| ms | test |"
          echo "|---:|---|"
          sed 's/\x1b\[[0-9;]*m//g' valgrind-output.txt \
            | sed -nE 's/.*\[(PASS|FAIL)\] (.*) \(([0-9]+)ms\)$/\3|\2/p' \
            | sort -t'|' -k1,1 -rn | head -15 \
            | awk -F'|' '{ printf "| %s | %s |\n", $1, $2 }'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Valgrind report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: valgrind-report
        path: |
          valgrind-output.txt
          valgrind-report.txt

  sanitizer-test:
    name: AddressSanitizer & LeakSanitizer
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup GCC
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list; sudo apt-get update
        sudo apt-get install -y gcc make

    - name: Setup Clang
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm

    - name: Build with AddressSanitizer
      run: |
        make clean
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Linux supports LeakSanitizer
          make compiler CFLAGS="-fsanitize=address -fsanitize=leak -fno-omit-frame-pointer -O1 -g" \
                        LDFLAGS="-fsanitize=address -fsanitize=leak -pthread -lm"
          make test-build CFLAGS="-fsanitize=address -fsanitize=leak -fno-omit-frame-pointer -O1 -g" \
                          LDFLAGS="-fsanitize=address -fsanitize=leak -pthread -lm"
        else
          # macOS doesn't support LeakSanitizer
          make compiler CFLAGS="-fsanitize=address -fno-omit-frame-pointer -O1 -g" \
                        LDFLAGS="-fsanitize=address -pthread -lm"
          make test-build CFLAGS="-fsanitize=address -fno-omit-frame-pointer -O1 -g" \
                          LDFLAGS="-fsanitize=address -pthread -lm"
        fi

    - name: Run tests with ASAN
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1:abort_on_error=1"
          export LSAN_OPTIONS="report_objects=1"
        else
          export ASAN_OPTIONS="halt_on_error=1:abort_on_error=1"
        fi
        ./build/test_runner

    # The compiler compiling a program, not just the unit tests. Everything
    # aetherc allocates for a compile should be released by the time it exits;
    # nothing checked that, and every program leaked. Linux only: LeakSanitizer
    # is the whole point and macOS has no LSan.
    - name: Compiler leak gate
      if: matrix.os == 'ubuntu-latest'
      run: bash tests/scripts/check_compiler_leaks.sh

    - name: Build with UndefinedBehaviorSanitizer
      run: |
        make clean
        make compiler CFLAGS="-fsanitize=undefined -fno-omit-frame-pointer -O1 -g" \
                      LDFLAGS="-fsanitize=undefined -pthread -lm"
        make test-build CFLAGS="-fsanitize=undefined -fno-omit-frame-pointer -O1 -g" \
                        LDFLAGS="-fsanitize=undefined -pthread -lm"

    - name: Run tests with UBSAN
      run: |
        ./build/test_runner

  memory-profiling:
    name: Memory Usage Profiling
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list; sudo apt-get update
        sudo apt-get install -y gcc make valgrind

    - name: Build with memory tracking
      run: |
        make clean
        make compiler CFLAGS="-DAETHER_MEMORY_TRACKING -O2 -g"
        make test-build CFLAGS="-DAETHER_MEMORY_TRACKING -O2 -g"

    - name: Run memory profiling
      run: |
        valgrind --tool=massif \
                 --massif-out-file=massif.out \
                 ./build/test_runner

    - name: Generate memory profile report
      run: |
        ms_print massif.out > memory-profile.txt
        cat memory-profile.txt

    - name: Check peak memory usage
      run: |
        peak=$(grep "peak" massif.out | head -1 | awk '{print $2}')
        echo "Peak memory usage: $peak bytes"

        # Fail if peak memory > 100MB
        if [ "$peak" -gt 104857600 ]; then
          echo "ERROR: Peak memory usage too high: $peak bytes"
          exit 1
        fi
        echo "SUCCESS: Peak memory usage acceptable"

    - name: Upload profiling report
      uses: actions/upload-artifact@v4
      with:
        name: memory-profile
        path: |
          massif.out
          memory-profile.txt

  architecture-tests:
    name: 64-bit Architecture Tests
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup GCC
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list; sudo apt-get update || brew update
        sudo apt-get install -y gcc make || brew install gcc make

    - name: Verify 64-bit compilation
      run: |
        make
        file build/aetherc | grep "64-bit"

    - name: Run tests on 64-bit
      run: |
        make test

    - name: Check pointer size
      run: |
        echo "Checking pointer and long size..."
        echo '#include <stdio.h>' > check_sizes.c
        echo 'int main() {' >> check_sizes.c
        echo '  printf("sizeof(void*) = %zu\n", sizeof(void*));' >> check_sizes.c
        echo '  printf("sizeof(long) = %zu\n", sizeof(long));' >> check_sizes.c
        echo '  printf("sizeof(size_t) = %zu\n", sizeof(size_t));' >> check_sizes.c
        echo '  return 0;' >> check_sizes.c
        echo '}' >> check_sizes.c
        gcc check_sizes.c -o check_sizes
        ./check_sizes

