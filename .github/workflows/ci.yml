name: Aether CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # ============================================================
  # Full CI suite — Linux (GCC), Linux (Clang), macOS (Clang)
  # Runs `make ci` which is the single source of truth:
  #   compiler (-Werror), ae, stdlib, unit tests,
  #   .ae integration tests (includes REPL tests), examples.
  # ============================================================
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-22.04
            cc: gcc
            harden: "0"
            install: sudo apt-get update && sudo apt-get install -y gcc make bc pkg-config libgtk-4-dev

          - name: Linux / Clang
            os: ubuntu-22.04
            cc: clang
            harden: "0"
            install: sudo apt-get update && sudo apt-get install -y clang make bc pkg-config libgtk-4-dev

          # Hardened gcc build (issue #396). Same OS + compiler as
          # Linux / GCC but with HARDEN=1 set in the environment, which
          # adds -fstack-protector-all + -D_FORTIFY_SOURCE=2 +
          # -Wformat-security to CFLAGS in the Makefile. A regression
          # that introduces an unchecked memcpy / strncpy / printf-
          # format-injection trips the gcc compile-time diagnostic here
          # before merge — defence-in-depth without imposing the
          # runtime overhead on the default release builds.
          - name: Linux / Hardened (gcc)
            os: ubuntu-22.04
            cc: gcc
            harden: "1"
            install: sudo apt-get update && sudo apt-get install -y gcc make bc pkg-config libgtk-4-dev

          - name: macOS / Clang (ARM64)
            os: macos-latest
            cc: clang
            harden: "0"
            install: ""

          - name: macOS / Clang (x86_64)
            os: macos-15-intel
            cc: clang
            harden: "0"
            install: ""

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      if: matrix.install != ''
      run: ${{ matrix.install }}

    # Cache the compiled miniaudio object (std.audio's ~96k-line vendored
    # header costs ~1 min to compile, and `make ci` starts with a clean).
    # Keyed per-OS + per-compiler + per-build-variant + the header/source
    # content, so a hit is only ever a byte-identical object; the Makefile's
    # audio-cache-restore double-checks a content stamp before reusing it and
    # falls back to a fresh compile on any mismatch. Never shared across
    # platforms (matrix.os/matrix.cc are in the key).
    #
    # Split restore/save: every run RESTORES, but only a trusted push to main
    # SAVES, and only on a cache MISS. So PR builds (throwaway) read the cache
    # but never fill it; the cache is populated once from the merge and shared
    # to every subsequent PR (GitHub lets PR runs read the default branch's
    # cache). The key embeds the source hash, so an unchanged miniaudio source
    # is a key hit → nothing new to save. A miss simply recompiles miniaudio;
    # correctness never depends on a cache hit.
    - name: Restore miniaudio object cache
      id: audio_cache
      uses: actions/cache/restore@v4
      with:
        path: .ci-cache
        key: audio-obj-${{ matrix.os }}-${{ matrix.cc }}-h${{ matrix.harden }}-${{ hashFiles('std/audio/miniaudio.h', 'std/audio/aether_audio.c', 'std/audio/aether_audio.h') }}

    - name: Run full CI suite
      run: HARDEN=${{ matrix.harden }} CC=${{ matrix.cc }} make ci

    - name: Save miniaudio object cache (merge to main, on miss only)
      if: >-
        github.event_name == 'push' && github.ref == 'refs/heads/main'
        && steps.audio_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .ci-cache
        key: audio-obj-${{ matrix.os }}-${{ matrix.cc }}-h${{ matrix.harden }}-${{ hashFiles('std/audio/miniaudio.h', 'std/audio/aether_audio.c', 'std/audio/aether_audio.h') }}

    # macOS leaks(1) gate (#468). Runs only on the ARM64 macOS job —
    # one macOS arch is enough leak coverage, and MallocStackLogging
    # is ~10x slower so we don't want it on both. Linux gets leak
    # coverage from test-valgrind + ASan-LSan; this is the only
    # detector that works on Apple Silicon (Apple clang ships ASan
    # without LSan; upstream LSan hangs here).
    - name: macOS leaks gate
      if: matrix.name == 'macOS / Clang (ARM64)'
      # Hard step cap as a backstop to the per-test timeouts inside
      # run_macos_leaks.sh: the gate can never hold a runner indefinitely.
      # 20 min is generous for 16 instrumented programs (leaks +
      # MallocStackLogging is ~10x slower than the bare run).
      timeout-minutes: 20
      run: make test-macos-leaks

  # ============================================================
  # FreeBSD cross-compile gate (#402)
  # `make ci` only ever compiles the platform branch matching its
  # runner, so this is the only job that reads the FreeBSD #ifdefs.
  # ============================================================
  # ============================================================
  # CHANGELOG guard (#1477)
  #
  # The release workflow turns a `## [current]` section into the version
  # heading. When no such section exists it used to rename nothing and ship
  # silently: releases 0.506.0 through 0.509.0 went out with no CHANGELOG
  # section at all, four releases of real work recorded nowhere, including a
  # Windows packaging fix. The release side now fails loudly, but that catches
  # it at release time, when the work has already merged and the author has
  # moved on.
  #
  # This catches it at the point it can still be fixed cheaply: a PR that
  # changes shipped code has to say what changed. Escape hatch for the genuine
  # exceptions (pure refactors, test-only work, CI plumbing): put
  # [skip changelog] in the PR title or any commit message.
  # ============================================================
  ci-changelog:
    name: CHANGELOG entry present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Require a CHANGELOG entry for code changes
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -eu

        changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

        # Only shipped code counts. Docs, tests and CI plumbing can land
        # without a user-visible entry.
        code=$(printf '%s\n' "$changed" | grep -E '^(std|runtime|compiler|contrib|tools)/' || true)
        if [ -z "$code" ]; then
          echo "No shipped-code changes; nothing to record."
          exit 0
        fi

        if printf '%s\n' "$changed" | grep -q '^CHANGELOG\.md$'; then
          echo "CHANGELOG.md is updated."

          # ... and the entry has to be somewhere the release can find it.
          # The release job renames the FIRST '## [current]' into the version
          # heading, so an entry that is not under one ships nowhere.
          #
          # This is not hypothetical, and it is not about forgetting the
          # heading either. When main cuts a release while a branch is open,
          # main's '## [current]' becomes '## [0.N.0]'; merging the branch
          # then folds its entry under that already-tagged heading and leaves
          # the file with no '[current]' at all. That has now happened twice
          # (0.539.0 and 0.549.0 both failed to bump), each time discovered
          # only when the release broke. Checking it here moves the discovery
          # to the PR that causes it.
          if ! grep -q '^## \[current\]$' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [current]' section."
            echo ""
            echo "The release job renames the first '## [current]' heading into"
            echo "the new version, so an entry outside one is not released."
            echo "If main cut a release while this branch was open, the merge"
            echo "folded your entry under that version's heading: move it back"
            echo "under a fresh '## [current]' and leave the tagged section as"
            echo "it shipped (compare with \`git show vX.Y.Z:CHANGELOG.md\`)."
            exit 1
          fi
          echo "The entry is under '## [current]'."
          exit 0
        fi

        # Explicit opt-out, in the PR title or any commit on the branch.
        if printf '%s' "$PR_TITLE" | grep -qi '\[skip changelog\]'; then
          echo "PR title opts out with [skip changelog]."
          exit 0
        fi
        if git log --pretty=%B "$BASE_SHA..$HEAD_SHA" | grep -qi '\[skip changelog\]'; then
          echo "A commit opts out with [skip changelog]."
          exit 0
        fi

        echo "::error::This PR changes shipped code but does not touch CHANGELOG.md."
        echo ""
        echo "The release workflow renames a '## [current]' section into the"
        echo "version heading. With no entry there is nothing to rename, which"
        echo "is how 0.506.0 through 0.509.0 shipped with no CHANGELOG at all."
        echo ""
        echo "Add your entry under '## [current]', or put [skip changelog] in"
        echo "the PR title if this genuinely needs no user-visible note."
        echo ""
        echo "Code files changed:"
        printf '%s\n' "$code" | sed 's/^/  /'
        exit 1

  ci-freebsd-cross:
    name: FreeBSD / cross-compile (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: sudo apt-get update && sudo apt-get install -y gcc make bc curl xz-utils

    # zig cc bundles no FreeBSD libc, so the base sysroot is what makes the
    # FreeBSD headers visible. Same source as the release leg.
    - name: Checkout aether-crossbuild
      uses: actions/checkout@v4
      with:
        repository: aether-lang-dev/aether-crossbuild
        path: crossbuild
        fetch-depth: 1

    # Tarballs, not unpacked trees: fetch-freebsd-base.sh rm -rf's its sysroot
    # dir every run. deps.lock pins both URLs and checksums.
    - name: Restore cross-toolchain download cache
      id: cross_cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .zig
          crossbuild/toolchain
          crossbuild/work/downloads
        key: freebsd-cross-${{ hashFiles('scripts/get-zig.sh', 'crossbuild/deps.lock') }}

    - name: Provision zig + FreeBSD base sysroot
      id: prov
      run: |
        ZIG="$($GITHUB_WORKSPACE/scripts/get-zig.sh "$GITHUB_WORKSPACE/.zig")"
        cd crossbuild
        ./scripts/fetch-freebsd-base.sh x86_64 15
        SR="$PWD/bases/x86_64-freebsd15"
        test -x "$ZIG" || { echo "zig not provisioned"; exit 1; }
        test "$("$ZIG" version)" = 0.16.0 || { echo "expected zig 0.16.0"; exit 1; }
        test -f "$SR/lib/libc.so.7" || { echo "FreeBSD base sysroot missing libc.so.7"; exit 1; }
        echo "zig=$ZIG"    >> "$GITHUB_OUTPUT"
        echo "sysroot=$SR" >> "$GITHUB_OUTPUT"

    - name: Save cross-toolchain download cache (merge to main, on miss only)
      if: >-
        github.event_name == 'push' && github.ref == 'refs/heads/main'
        && steps.cross_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          .zig
          crossbuild/toolchain
          crossbuild/work/downloads
        key: freebsd-cross-${{ hashFiles('scripts/get-zig.sh', 'crossbuild/deps.lock') }}

    - name: Cross-build for FreeBSD (FREEBSD=1)
      run: |
        make compiler ae stdlib \
          FREEBSD=1 \
          ZIG="${{ steps.prov.outputs.zig }}" \
          AETHER_SYSROOT="${{ steps.prov.outputs.sysroot }}"
        # A cross-build that silently emitted Linux binaries would prove nothing.
        file build/aetherc build/ae
        file build/ae | grep -q 'FreeBSD' || { echo "ae is not a FreeBSD binary"; exit 1; }

  # ============================================================
  # FreeBSD native build + test (#402)
  # Scoped to `make test`; the .ae suites would rebuild through the
  # freshly built toolchain and take hours inside the VM.
  # ============================================================
  ci-freebsd-native:
    name: FreeBSD / native build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Build and test inside a FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        release: '14.2'
        usesh: true
        # bc lives in FreeBSD base, not in pkg: asking for it fails the run.
        prepare: |
          pkg install -y gmake pkgconf
        run: |
          set -e
          gmake compiler ae stdlib
          gmake test

  # ============================================================
  # contrib/host bridge check — syntax check of every host bridge
  # in stub mode (always-on), plus end-to-end build+link+run of
  # host demos for every language whose dev library is installed
  # on the runner. Linux-only since apt installs most dev libs
  # in one shot; other platforms can be added if needed.
  # ============================================================
  ci-contrib-host:
    name: contrib/host bridges (Linux)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install host language dev libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc make bc pkg-config \
          liblua5.3-dev \
          python3-dev \
          ruby-dev \
          libperl-dev \
          duktape-dev \
          tcl-dev \
          golang-go

    - name: Build compiler + stdlib
      run: make compiler ae stdlib

    - name: Run contrib/host check
      run: make contrib-host-check

    - name: Type-check every non-host contrib module
      run: make check-contrib-modules

  # ============================================================
  # contrib runtime check — build + RUN every contrib test_*.ae
  # (tinyweb, i18n/collation, …), not just type-check them. This
  # is the coverage `make ci` lacks (contrib isn't in the test-ae
  # glob) and the class of bug type-checking misses: tinyweb's
  # WebSocket server path type-checked fine but was runtime-broken.
  # Runs under valgrind where the test is leak-clean by design.
  # All C is vendored (utf8proc/DUCET committed) so nothing is
  # fetched at build time. Linux-only; contrib here is pure Aether
  # + portable C.
  # ============================================================
  ci-contrib:
    name: contrib runtime tests (Linux)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make valgrind
        # contrib/vulkan needs the headers to build and a driver to run.
        # lavapipe is Mesa's CPU implementation, so the GPU path is exercised
        # on a runner that has no GPU. Without these the test skips itself and
        # the leg still passes, which would be silent non-coverage; the
        # assertion below is what makes the skip visible.
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools

    - name: Report the Vulkan implementation in use
      run: |
        VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
          vulkaninfo --summary 2>/dev/null | head -30 || true

    - name: Build + run all contrib tests (valgrind-gated where leak-clean)
      env:
        VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      run: make contrib-check-valgrind

    # A driver is installed above, so contrib/vulkan skipping here would mean
    # the GPU path silently stopped being covered. Fail instead.
    - name: Assert the Vulkan test actually ran
      env:
        VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      run: |
        out="$(./build/contrib-check/vulkan_offscreen 2>&1 || true)"
        echo "$out"
        # The spec must PASS cases, not skip them. std.spec prints
        # "N passing" and, separately, "N skipped" — so grepping only for
        # "passing" would accept a run of 0. Require a non-zero pass count
        # AND no skips: with a driver installed, every case must render.
        passing="$(printf '%s' "$out" | sed -n 's/.*[^0-9]\([0-9][0-9]*\) passing.*/\1/p' | head -1)"
        skipped="$(printf '%s' "$out" | sed -n 's/.*[^0-9]\([0-9][0-9]*\) skipped.*/\1/p' | head -1)"
        if [ -z "$passing" ] || [ "$passing" -eq 0 ] || [ -n "$skipped" ]; then
          echo "contrib/vulkan did not render; lavapipe should be present on this leg"
          echo "  passing=${passing:-none} skipped=${skipped:-0}"
          exit 1
        fi

  # ============================================================
  # Windows CI — MinGW via MSYS2
  # Runs `make ci` — compiler, ae, stdlib, unit tests,
  # .ae integration tests (includes REPL tests), examples.
  # ============================================================
  ci-windows:
    name: Windows / GCC (MSYS2)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        # zlib + openssl are needed by std.zlib and std.cryptography
        # (+ std.net TLS). Without them AETHER_HAS_ZLIB /
        # AETHER_HAS_OPENSSL go undefined and the stdlib wrappers
        # fall into their "unavailable" stub paths — which is a real
        # cliff for users of the Windows binary release, not just a
        # test-matrix skip.
        # ca-certificates ships /mingw64/etc/ssl/certs/ca-bundle.crt — required
        # for HTTPS in std.net (without it the OpenSSL handshake completes but
        # cert verification fails for lack of a trust anchor on Windows).
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-openssl mingw-w64-x86_64-ca-certificates pkg-config make bc

    # Windows Defender real-time scanning of every compiler-produced
    # file is the dominant Windows-CI tax: `make ci` builds ~585 separate
    # test executables, and AV-scanning each .c/.o/.exe as it is written
    # made the .ae test phase ~33 min (vs ~5 min for the same suite on
    # Linux/macOS, which have no such scanner). Excluding the runner work
    # tree + temp dirs (and the toolchain processes) from real-time
    # scanning removes that per-file tax. Best-effort: the job must never
    # fail because Defender wasn't adjustable on a given runner image.
    - name: Speed up build — exclude work tree from Windows Defender
      shell: pwsh
      continue-on-error: true
      run: |
        Add-MpPreference -ExclusionPath "D:\a" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "$env:TMP" -ErrorAction SilentlyContinue
        foreach ($p in 'gcc.exe','cc1.exe','collect2.exe','ld.exe','as.exe','aetherc.exe','ae.exe','bash.exe','sh.exe','make.exe') {
          Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue
        }
        Write-Host "Windows Defender exclusions applied (best-effort)."

    - name: Run CI suite
      # 45-min backstop — a true safety net, not a tuning knob. The suite
      # runs ~32-36 min on this runner (a handful of HTTP tests that
      # statically link openssl/nghttp2/zlib/pcre2 dominate the .ae phase),
      # so the cap sits above the natural runtime and only fires on a real
      # hang, never on a slow-but-progressing run. (An earlier 30-min cap
      # killed a healthy ~32-min run.) NPROC is left at the runner default
      # (nproc=4): oversubscribing to 8 made it WORSE, because 8 of those
      # heavy static links running at once thrash the 4-vCPU runner's RAM
      # (one link ballooned to 11 min). Meaningfully cutting this needs a
      # faster linker / fewer per-test relinks, tracked separately.
      timeout-minutes: 45
      # The hardcoded `C:\msys64\...` probe in aether_http.c::load_windows_ca_bundle
      # doesn't match the GitHub runner's MSYS2 path (it's installed under a
      # temp dir, not C:\msys64). Export SSL_CERT_FILE explicitly using
      # cygpath -w so the first probe in get_ssl_ctx() hits regardless of
      # where MSYS2 lives on this runner. Without this, `tests/regression/
      # test_https_client.ae` fails with "certificate verify failed".
      run: |
        export SSL_CERT_FILE="$(cygpath -w /mingw64/etc/ssl/certs/ca-bundle.crt)"
        echo "SSL_CERT_FILE=$SSL_CERT_FILE"
        ls -la "$(cygpath -u "$SSL_CERT_FILE")"
        make ci

  # ============================================================
  # Platform portability — cooperative scheduler, WASM, embedded
  # Verifies Aether compiles and runs on threadless platforms.
  # ============================================================
  ci-coop:
    name: Cooperative Scheduler (no pthreads)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: sudo apt-get update && sudo apt-get install -y gcc make bc

    - name: Run cooperative scheduler CI
      run: make ci-coop

  ci-wasm:
    name: WebAssembly (Emscripten)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.51

    - name: Install native GCC
      run: sudo apt-get update && sudo apt-get install -y gcc make bc curl xz-utils

    - name: Verify WASI panic runtime with Zig 0.16.0
      run: |
        ZIG="$(./scripts/get-zig.sh "$RUNNER_TEMP/zig")"
        "$ZIG" cc -target wasm32-wasi -c runtime/actors/aether_panic.c \
          -D_WASI_EMULATED_SIGNAL -D__wasm_exception_handling__=1 \
          -Iruntime -Iruntime/actors -Istd/string \
          -o "$RUNNER_TEMP/aether_panic_wasi.o"

    - name: Run WASM CI
      run: make ci-wasm

  ci-embedded:
    name: Embedded ARM (Cortex-M4)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install ARM cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make gcc-arm-none-eabi libnewlib-arm-none-eabi

    - name: Run embedded CI
      run: make ci-embedded

  # ============================================================
  # RISC-V 64-bit cross-compile + qemu-user-static (issue #397).
  # Catches portability bugs that an x86_64-only matrix can't see —
  # pointer-width / struct-padding / atomic-instruction differences
  # between x86_64 and riscv64. The cross-compiler is a host x86_64
  # binary; qemu-riscv64-static actually runs the cross-built
  # aetherc / ae for a smoke check.
  # ============================================================
  ci-riscv64:
    name: Linux / RISC-V 64 (cross via qemu)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install RISC-V cross-toolchain + qemu
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-riscv64-linux-gnu \
          libc6-dev-riscv64-cross \
          qemu-user-static \
          make bc pkg-config file

    - name: Run RISC-V CI
      run: make ci-riscv64

  # ============================================================
  # Memory safety — Valgrind + AddressSanitizer on Linux/GCC
  # Separate from main CI because it needs special build flags
  # and is slower. Runs in parallel with the ci job.
  # ============================================================
  memory-checks:
    name: Memory Safety (Valgrind + ASan)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind gcc-multilib

    - name: Valgrind — runtime test suite
      run: |
        CFLAGS="-g -O0" make compiler
        CFLAGS="-g -O0" make test-build
        valgrind --leak-check=full \
                 --show-leak-kinds=all \
                 --track-origins=yes \
                 --error-exitcode=0 \
                 --log-file=valgrind.log \
                 ./build/test_runner 2>&1 || true
        if grep -q "definitely lost: 0 bytes" valgrind.log && \
           grep -q "indirectly lost: 0 bytes" valgrind.log; then
          echo "No memory leaks detected"
        else
          echo "WARNING: Memory leaks detected (non-fatal)"
          head -100 valgrind.log
        fi
      continue-on-error: true

    - name: AddressSanitizer — runtime test suite
      run: |
        make clean
        make compiler CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
                      LDFLAGS="-fsanitize=address -pthread -lm"
        make test-build CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
                        LDFLAGS="-fsanitize=address -pthread -lm"
        ASAN_OPTIONS=detect_leaks=1:check_initialization_order=1 \
          ./build/test_runner 2>&1 | tee asan.log
        if grep -q "ERROR: AddressSanitizer" asan.log; then
          echo "ERROR: AddressSanitizer detected errors!"
          cat asan.log
          exit 1
        fi

    - name: Upload memory reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: memory-reports
        path: |
          valgrind.log
          asan.log
        retention-days: 7
